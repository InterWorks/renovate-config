name: Check npm/cli#9800

# Fails once npm/cli#9800 stops reproducing (or the probe breaks), blocking every
# PR until the allow-remote=all workaround in default.json is removed or replaced.
# See https://github.com/InterWorks/renovate-config/issues/8

on:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - run: npm install -g npm@12
      - run: bash .github/scripts/check-npm-9800.sh
