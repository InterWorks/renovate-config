name: Check npm/cli#9800

# Probes whether npm/cli#9800 still reproduces, i.e. whether the allow-remote=all
# workaround in default.json is still needed. Fails on every trigger once it isn't
# (or the probe breaks), and mentions CODEOWNERS on the PR or, otherwise, on #8.
# See https://github.com/InterWorks/renovate-config/issues/8

on:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g npm@12
      - id: probe
        run: |
          set +e
          bash .github/scripts/check-npm-9800.sh
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Report
        # Fork PRs get a read-only token; don't let a failed comment block them.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/report-npm-9800.sh "${{ steps.probe.outputs.status }}"
      - name: Fail
        if: steps.probe.outputs.status != '0'
        run: exit 1
