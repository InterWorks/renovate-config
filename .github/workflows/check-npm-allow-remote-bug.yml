name: Check npm/cli#9800

# Passes while npm/cli#9800 reproduces. Failing means either the fix shipped in
# npm (check Renovate's runner before removing the workaround) or the probe broke.
# See https://github.com/InterWorks/renovate-config/issues/8

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g npm@12
      - run: bash .github/scripts/check-npm-9800.sh
